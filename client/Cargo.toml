[package]
name = "dumetodo-client"
version = "0.1.0"
edition = "2024"
description = "DuMetodo: browser desktop personalizzato (la grafica resta sul server)"
license = "LicenseRef-Proprietario"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
muda = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
open = "5"
url = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
