<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DuMetodo">
  <defs>
    <linearGradient id="dm-sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#1046b3"/>
    </linearGradient>
  </defs>
  <!-- fondo: "schermo" del sistema -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dm-sfondo)"/>
  <!-- quadrante di misura: arco a 3/4 -->
  <path d="M17.2 46.8 A21 21 0 1 1 46.8 46.8" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <path d="M17.2 46.8 A21 21 0 0 1 32 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- tacche della scala -->
  <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 18.5v4"/>
    <path d="M44.7 23.3l-2.8 2.8"/>
    <path d="M19.3 23.3l2.8 2.8"/>
    <path d="M50 37h-4"/>
    <path d="M14 37h4"/>
  </g>
  <!-- lancetta -->
  <path d="M32 37 L43.5 26.5" stroke="#ffd34d" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="32" cy="37" r="5" fill="#ffffff"/>
  <!-- barre di dati sotto il quadrante -->
  <g fill="#ffffff">
    <rect x="25" y="47" width="3.6" height="7" rx="1.2" opacity=".75"/>
    <rect x="30.2" y="44.5" width="3.6" height="9.5" rx="1.2"/>
    <rect x="35.4" y="49" width="3.6" height="5" rx="1.2" opacity=".75"/>
  </g>
</svg>
