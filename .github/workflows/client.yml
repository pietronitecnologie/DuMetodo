name: client
on:
  push:
    paths: ["client/**", ".github/workflows/client.yml"]
    # Un tag client-vX.Y.Z pubblica la versione come Release di GitHub (vedi client/README.md).
    tags: ["client-v*"]
  pull_request:
    paths: ["client/**"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: DuMetodo-Client-Windows
          path: client/target/release/dumetodo-client.exe
  rilascio:
    # Solo per i tag client-vX.Y.Z: Release "DuMetodo Client X.Y.Z" con l'eseguibile allegato.
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [linux, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults: { run: { working-directory: client, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - name: Controlla che il tag corrisponda alla versione in Cargo.toml
        run: |
          $tag = "${{ github.ref_name }}".Substring(8)
          $versione = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $versione) { Write-Error "Il tag client-v$tag non corrisponde alla versione $versione di Cargo.toml"; exit 1 }
          "VERSIONE=$versione" >> $env:GITHUB_ENV
      - run: cargo build --release
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nome = "dumetodo-client-$env:VERSIONE.exe"
          Copy-Item target/release/dumetodo-client.exe $nome
          $hash = (Get-FileHash $nome -Algorithm SHA256).Hash.ToLower()
          $note = "Client desktop DuMetodo $env:VERSIONE.`n`nSHA-256: $hash`n`nPer distribuirlo agli utenti: in DuMetodo, Amministrazione > Aggiornamenti del client, carica questo file con la versione $env:VERSIONE."
          gh release create "${{ github.ref_name }}" $nome --title "DuMetodo Client $env:VERSIONE" --notes $note
