name: client
on:
  push:
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: DuMetodo-Client-Windows
          path: client/target/release/dumetodo-client.exe
