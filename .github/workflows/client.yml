name: client
on:
  push:
    # Con «tags» va indicato anche «branches», altrimenti i push sui rami non avviano il workflow.
    branches: ["**"]
    paths: ["client/**", ".github/workflows/client.yml"]
    # Un tag client-vX.Y.Z pubblica la versione come Release di GitHub (vedi client/README.md).
    tags: ["client-v*"]
  pull_request:
    paths: ["client/**"]
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Metodo-Client-Windows
          path: client/target/release/metodo-client.exe
  debian:
    # Compilato DENTRO Debian 12: il pacchetto funziona su Debian 12 e successive (e Ubuntu 24.04+).
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Strumenti di compilazione
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential pkg-config dpkg-dev libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Pacchetto .deb
        run: client/pacchetto-deb.sh "$GITHUB_WORKSPACE/pacchetto"
      - name: Prova di installazione su Debian 12
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./pacchetto/metodo-client_*.deb
          dpkg -s metodo-client | grep -E '^(Version|Depends):'
          ! ldd /usr/bin/metodo-client | grep 'not found'
          test -f /usr/share/applications/metodo-client.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Metodo-Client-Debian
          path: pacchetto/*.deb
  rilascio:
    # Solo per i tag client-vX.Y.Z: Release "Metodo v2 Client X.Y.Z" con l'eseguibile allegato.
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: [linux, windows, debian]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults: { run: { working-directory: client, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - name: Controlla che il tag corrisponda alla versione in Cargo.toml
        run: |
          $tag = "${{ github.ref_name }}".Substring(8)
          $versione = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $versione) { Write-Error "Il tag client-v$tag non corrisponde alla versione $versione di Cargo.toml"; exit 1 }
          "VERSIONE=$versione" >> $env:GITHUB_ENV
      - run: cargo build --release
      - uses: actions/download-artifact@v4
        with:
          name: Metodo-Client-Debian
          path: client/pacchetto
      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nome = "metodo-client-$env:VERSIONE.exe"
          Copy-Item target/release/metodo-client.exe $nome
          $hash = (Get-FileHash $nome -Algorithm SHA256).Hash.ToLower()
          $deb = (Get-ChildItem pacchetto/*.deb)[0]
          $hashDeb = (Get-FileHash $deb.FullName -Algorithm SHA256).Hash.ToLower()
          $note = "Client desktop Metodo v2 $env:VERSIONE.`n`n" +
            "**Windows** — $nome`nSHA-256: $hash`nPer distribuirlo agli utenti: in Metodo v2, Amministrazione > Aggiornamenti del client, carica questo file con la versione $env:VERSIONE.`n`n" +
            "**Debian 12+ / Ubuntu 24.04+** — $($deb.Name)`nSHA-256: $hashDeb`nInstallazione: sudo apt install ./$($deb.Name)"
          gh release create "${{ github.ref_name }}" $nome $deb.FullName --title "Metodo v2 Client $env:VERSIONE" --notes $note
