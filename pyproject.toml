[project]
name = "dumetodo"
version = "0.1.0"
description = "DuMetodo - gestione della Produzione (riscrittura del modulo Prod di Metodo)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-htmx>=1.19",
    "django-simple-history>=3.7",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "imapclient>=3.0",
    "openpyxl>=3.1",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "nh3>=0.2",
    "cryptography>=43",
    "pillow>=10",
]

[project.optional-dependencies]
# Server per l'installazione semplice su Windows (gunicorn non gira su Windows).
semplice = ["waitress>=3.0"]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dumetodo*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF012", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"config/settings/*" = ["F405", "F403"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
