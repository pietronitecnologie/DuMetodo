<div id="pannello-tracciabilita">
{% if tracce %}
<div class="card mb-3">
  <div class="card-header d-flex align-items-center gap-2"><strong class="me-auto">Tracce (archivio)</strong>
    <a class="small" href="{% url 'tracciabilita:tracce' %}?ordine={{ ordine.pk }}&dal=2000-01-01">tutte</a></div>
  <div class="table-responsive">
  <table class="table table-sm mb-0 small">
    <thead><tr><th>Data</th><th>Elemento</th><th>Chiave</th><th>Valore</th><th>Reparto</th></tr></thead>
    <tbody>
    {% for t in tracce %}
    <tr><td><a href="{{ t.get_absolute_url }}">{{ t.data|date:"d/m/Y H:i" }}</a></td><td>{{ t.elemento.codice|default:"" }}</td>
      <td>{{ t.chiave_leggibile }}</td><td>{{ t.valore }}</td><td>{{ t.reparto|default:"" }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endif %}
</div>
