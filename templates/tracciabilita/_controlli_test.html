{% if righe %}
<table class="table table-sm align-middle mb-0">
  <thead><tr><th>Controllo</th><th style="width: 9rem">Campione</th><th style="width: 9rem">KO</th></tr></thead>
  <tbody>
  {% for r in righe %}
  <tr>
    <td>{{ r.controllo.nome }}{% if r.controllo.descrizione %}<div class="small text-muted">{{ r.controllo.descrizione }}</div>{% endif %}</td>
    {% if r.controllo.tipo == "PRE" %}
    <td colspan="2"><div class="form-check">
      <input class="form-check-input" type="checkbox" name="presente_{{ r.controllo.codice }}" id="presente_{{ r.controllo.codice }}"{% if r.presente %} checked{% endif %}>
      <label class="form-check-label" for="presente_{{ r.controllo.codice }}">Presente</label></div></td>
    {% else %}
    <td><input class="form-control form-control-sm" type="number" min="0" step="1" required placeholder="Campione"
               name="campione_{{ r.controllo.codice }}" value="{{ r.campione }}"></td>
    <td><input class="form-control form-control-sm" type="number" min="0" step="1" required placeholder="KO"
               name="ko_{{ r.controllo.codice }}" value="{{ r.ko }}"></td>
    {% endif %}
  </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}<p class="text-muted small mb-0">Scegli un test per vedere i controlli da eseguire.</p>{% endif %}
