<form method="get" class="d-flex flex-wrap gap-2 align-items-end mb-3">
  <div><label class="form-label small mb-0">Fino alla settimana del</label><input type="date" name="fino_a" class="form-control form-control-sm" value="{{ fino_a|date:'Y-m-d' }}"></div>
  <div><label class="form-label small mb-0">Settimane</label><input type="number" name="settimane" min="1" max="52" class="form-control form-control-sm" style="width:6rem" value="{{ n }}"></div>
  <button class="btn btn-sm btn-primary">Aggiorna</button>
  <a class="btn btn-sm btn-outline-primary" href="?fino_a={{ fino_a|date:'Y-m-d' }}&settimane={{ n }}&formato=xlsx">Excel</a>
</form>
