{% load static %}<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Badge {{ lav }}</title>
<style>
  @page { size: 85.6mm 54mm; margin: 0; }
  body { margin: 0; font: 12px Arial, Helvetica, sans-serif; }
  .comandi { padding: 10px; } @media print { .comandi { display: none; } }
  .badge { width: 85.6mm; height: 54mm; box-sizing: border-box; padding: 3.5mm 4mm; border: 1px dashed #bbb; display: grid;
    grid-template-columns: 1fr 24mm; grid-template-rows: auto 1fr auto; gap: 1mm 3mm; overflow: hidden; }
  @media print { .badge { border: 0; } }
  .azienda { grid-column: 1 / 3; font-weight: bold; font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: .05em; }
  .nome { font-size: 16px; font-weight: bold; } .matr { color: #444; margin-top: 1mm; }
  #qr { grid-row: 2 / 4; grid-column: 2; align-self: end; } #qr svg, #qr img { width: 24mm; height: 24mm; display: block; }
  #barcode { grid-column: 1; width: 100%; height: 14mm; }
</style>
<script src="{% static 'vendor/qrcode-generator.js' %}"></script>
<script src="{% static 'vendor/JsBarcode.all.min.js' %}"></script>
</head><body>
<div class="comandi"><button onclick="window.print()">Stampa</button> <span>Formato tessera 85,6 × 54 mm (es. stampante per badge o cartoncino da ritagliare).</span></div>
<div class="badge">
  <div class="azienda">{{ nome_fornitore }} · Timbrature</div>
  <div><div class="nome">{{ lav.nome }} {{ lav.cognome }}</div><div class="matr">Matricola {{ lav.matricola }}</div></div>
  <div id="qr"></div>
  <svg id="barcode"></svg>
</div>
<script>
  const valore = "{{ i.valore|escapejs }}";
  const qr = qrcode(0, "M"); qr.addData(valore); qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
  JsBarcode("#barcode", valore, { format: "CODE128", displayValue: true, fontSize: 11, height: 34, margin: 0, width: 1.6 });
</script>
</body></html>
