{% if testo %}<div class="list-group dm-ordine-risultati shadow-sm">
{% for o in ordini %}
  <button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-1"
          data-dm-ordine-pk="{{ o.pk }}">
    {% include "ordini/_ordine_etichetta.html" %}
    <span class="ms-auto small text-muted text-end">{{ o.get_stato_display }}{% if o.data_scadenza %} · scad. {{ o.data_scadenza|date:"d/m/Y" }}{% endif %}</span>
  </button>
{% empty %}
  <div class="list-group-item small text-muted">Nessun ordine per «{{ testo }}».</div>
{% endfor %}
</div>{% endif %}
