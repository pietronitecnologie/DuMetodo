<div class="list-group dm-ordine-risultati shadow">
  {% if not testo %}<div class="list-group-item py-1 small text-muted bg-body-tertiary">Ordini aperti con la scadenza più vicina — scrivi per cercare</div>{% endif %}
{% for o in ordini %}
  <button type="button" class="list-group-item list-group-item-action py-1" data-dm-ordine-pk="{{ o.pk }}">
    {% include "ordini/_ordine_etichetta.html" %}
    <div class="small text-muted">{{ o.get_stato_display }}{% if o.data_scadenza %} · scadenza {{ o.data_scadenza|date:"d/m/Y" }}{% endif %}</div>
  </button>
{% empty %}
  <div class="list-group-item small text-muted">Nessun ordine{% if testo %} per «{{ testo }}»{% endif %}.</div>
{% endfor %}
</div>
