# Avvio rapido: ./avvia-dumetodo.sh (Linux/macOS) o avvia-dumetodo.ps1 (Windows).
# Manuale: cp .env.example .env (e compilalo), poi: docker compose up -d --build
x-app: &app
  build:
    context: .
    args:
      DUMETODO_VERSIONE: ${DUMETODO_VERSIONE:-sconosciuta}
  image: dumetodo:locale
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dumetodo
      POSTGRES_USER: dumetodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumetodo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py crea_ruoli && python manage.py configura_pianificazioni"

  web:
    <<: *app
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    healthcheck:
      # /salute/ risponde se database e cache funzionano (usato anche da MetodoConsole).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salute/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    volumes: [media:/app/media]
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *app
    # UN SOLO processo beat: è lui che decide quando partono i lavori periodici.
    command: celery -A config beat --loglevel=INFO
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  media:
