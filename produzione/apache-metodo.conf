# Metodo v2 dietro Apache. Copia in /etc/apache2/sites-available/metodo-v2.conf, sostituisci DOMINIO e PORTA:
#   a2enmod proxy proxy_http headers
#   a2ensite metodo-v2 && apachectl configtest && systemctl reload apache2
#   certbot --apache -d DOMINIO            (certificato HTTPS gratuito, rinnovo automatico)
# Gli altri siti (il Metodo attuale) non vengono toccati.

<VirtualHost *:80>
    ServerName DOMINIO

    LimitRequestBody 31457280
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:PORTA/
    ProxyPassReverse / http://127.0.0.1:PORTA/
    # Metodo v2 lo usa per sapere che è in https (certbot copia il VirtualHost su *:443)
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
</VirtualHost>
