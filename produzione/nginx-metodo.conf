# Metodo v2 dietro nginx. Copia in /etc/nginx/sites-available/metodo-v2, sostituisci DOMINIO e PORTA, poi:
#   ln -s /etc/nginx/sites-available/metodo-v2 /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d DOMINIO            (certificato HTTPS gratuito, rinnovo automatico)
# Le altre configurazioni (il Metodo attuale) non vengono toccate: è un sito in più, con il suo nome.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;
    # certbot aggiunge da solo il redirect a https e il blocco «listen 443 ssl»

    client_max_body_size 30m;          # allegati, foto delle tracciature, file d'ordine

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;     # Metodo v2 lo usa per sapere che è in https
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Aggiornamenti in tempo reale (HTMX, chat): niente buffer sulle risposte lente
        proxy_buffering off;
    }
}
