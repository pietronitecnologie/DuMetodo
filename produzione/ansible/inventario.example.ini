# Copia in inventario.ini e metti l'indirizzo del server. Si entra come utente «claude» (o un altro utente non root)
# con una chiave SSH; i comandi da amministratore passano da sudo con la password, chiesta a ogni esecuzione.
[metodo]
metodo.example.com ansible_user=claude

[metodo:vars]
# Cartella di Metodo v2 sul server (dove c'è compose.yaml).
cartella_metodo=/opt/metodo
